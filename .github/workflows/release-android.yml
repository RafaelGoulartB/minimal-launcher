name: Release Android APK

on:
  push:
    branches:
      - main
    # Documentation and landing-page-only changes do not need a new APK.
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -nE 's/^[[:space:]]*val baseVersionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -n "$latest_tag" ]]; then
            current_version="${latest_tag#v}"
          else
            current_version="$base_version"
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Cannot calculate a patch release from version: $current_version" >&2
            exit 1
          fi

          version="$major.$minor.$((patch + 1))"
          version_code="$((10000 + GITHUB_RUN_NUMBER))"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required GitHub Actions secret is missing: $value" >&2
              exit 1
            fi
          done

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$keystore_path"
          } > key.properties

      - name: Build signed release APK
        run: >-
          ./gradlew --no-daemon :app:assembleRelease
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Prepare release assets
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          asset="minimal-launcher-${{ steps.version.outputs.version }}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "path=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.asset.outputs.path }}"
          "${{ steps.asset.outputs.path }}.sha256"
          --target "${{ github.sha }}"
          --title "Minimal Launcher ${{ steps.version.outputs.version }}"
          --generate-notes
